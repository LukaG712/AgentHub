name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # Fast required check: lint + tests on Ubuntu / Python 3.12
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check hub/ tests/

      - name: Run tests
        env:
          HUB_API_KEY: test-ci-key
        run: python -m pytest tests/ -vv --tb=short --durations=25 --timeout=60

  # Compatibility check (non-blocking): Python 3.11 import smoke test
  compat:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke test
        env:
          HUB_API_KEY: test-ci-key
        run: python -c "import hub; from hub import api; print('OK')"
