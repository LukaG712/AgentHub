name: Desktop Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop app
        working-directory: desktop
        run: npm run build

      - name: Verify installer artifact exists
        run: |
          $installer = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "No installer .exe found in bundle/nsis directory"
            exit 1
          }
          Write-Host "Found installer: $($installer.Name)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentHub-Setup-Windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Generate portable package
        run: |
          $zipName = "AgentHub-Portable-Windows-x64.zip"
          Compress-Archive -Path "desktop/src-tauri/target/release/agent-hub-desktop.exe" -DestinationPath "desktop/$zipName" -Force
          Write-Host "Created portable package: $zipName"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentHub-Portable-Windows-x64
          path: desktop/AgentHub-Portable-Windows-x64.zip
          if-no-files-found: error
