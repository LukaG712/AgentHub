<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Hub</title>
<style>
:root {
  --bg: #f5f5f5; --fg: #1a1a1a; --card-bg: #fff; --border: #ddd;
  --accent: #2563eb; --accent-hover: #1d4ed8; --danger: #dc2626;
  --success: #16a34a; --warning: #d97706; --muted: #6b7280;
  --user-bubble: #2563eb; --user-bubble-text: #fff;
  --assistant-bubble: #e5e7eb; --assistant-bubble-text: #1a1a1a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827; --fg: #e5e7eb; --card-bg: #1f2937; --border: #374151;
    --accent: #3b82f6; --accent-hover: #60a5fa; --danger: #ef4444;
    --success: #22c55e; --warning: #f59e0b; --muted: #9ca3af;
    --user-bubble: #3b82f6; --user-bubble-text: #fff;
    --assistant-bubble: #374151; --assistant-bubble-text: #e5e7eb;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); }
.hidden { display: none !important; }

/* Auth prompt */
#auth-prompt { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
#auth-prompt form { background: var(--card-bg); padding: 2rem; border-radius: 8px; border: 1px solid var(--border); }
#auth-prompt input { padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); width: 250px; }
#auth-prompt button { padding: 0.5rem 1rem; background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-left: 0.5rem; }

/* Header */
header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); background: var(--card-bg); }
header h1 { font-size: 1.2rem; }
nav button { background: none; border: none; color: var(--fg); cursor: pointer; padding: 0.5rem 0.75rem; font-size: 0.9rem; }
nav button.active { border-bottom: 2px solid var(--accent); }

/* Main */
main { padding: 1rem; max-width: 1200px; margin: 0 auto; }

/* Agent cards */
.state-group { margin-bottom: 1.5rem; }
.state-group h2 { font-size: 1rem; margin-bottom: 0.5rem; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; cursor: pointer; transition: border-color 0.2s; }
.card:hover { border-color: var(--accent); }
.card h3 { font-size: 1rem; margin-bottom: 0.25rem; }
.card .meta { font-size: 0.85rem; color: var(--muted); }
.card .task { font-size: 0.85rem; margin-top: 0.5rem; color: var(--accent); }
.card.working { border-left: 3px solid var(--success); }
.card.failed { border-left: 3px solid var(--danger); }

/* Bottom bar */
#bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); padding: 0.75rem 1rem; display: flex; gap: 0.5rem; align-items: center; }
#bottom-bar select, #bottom-bar input { padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); }
#bottom-bar input { flex: 1; }
#bottom-bar button { padding: 0.5rem 1rem; background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; }

/* Agent panel */
#agent-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
#agent-panel h2 { margin-bottom: 1rem; }
.panel-section { margin-bottom: 1rem; }
.panel-section h3 { font-size: 0.9rem; color: var(--muted); margin-bottom: 0.5rem; }
.panel-section textarea, .panel-section input { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); font-family: inherit; }
.panel-section textarea { min-height: 80px; resize: vertical; }
.output-box { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.75rem; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; }
.btn { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-save { background: var(--accent); color: #fff; }
.btn-small { padding: 0.2rem 0.5rem; font-size: 0.8rem; }
.skill-toggles { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.skill-toggle { display: flex; align-items: center; gap: 0.3rem; }

/* Skills page */
.skills-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.75rem; }
.skill-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
.skill-card h3 { margin-bottom: 0.25rem; }
.skill-card .desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
.skill-card .agents { font-size: 0.8rem; color: var(--muted); }
.skill-card .actions { margin-top: 0.5rem; display: flex; gap: 0.3rem; }
#skill-form { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
#skill-form textarea { width: 100%; min-height: 120px; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); font-family: monospace; }

/* Run history */
.run-item { padding: 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; cursor: pointer; }
.run-item:hover { background: var(--bg); }
.run-item .state { font-weight: bold; }
.run-item .state.done { color: var(--success); }
.run-item .state.failed { color: var(--danger); }
.run-item .state.working { color: var(--warning); }

/* Matrix */
.matrix-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.matrix-table th, .matrix-table td { padding: 0.4rem; border: 1px solid var(--border); text-align: center; }
.matrix-table th { background: var(--bg); }

/* Chat page */
#page-chat { display: flex; gap: 0; height: calc(100vh - 120px); }
#chat-sidebar { width: 260px; border-right: 1px solid var(--border); background: var(--card-bg); display: flex; flex-direction: column; flex-shrink: 0; }
#chat-sidebar-header { padding: 0.75rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
#chat-sidebar-header h3 { font-size: 0.9rem; }
#chat-session-list { flex: 1; overflow-y: auto; }
.chat-session-item { padding: 0.6rem 0.75rem; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
.chat-session-item:hover { background: var(--bg); }
.chat-session-item.active { background: var(--accent); color: #fff; }
.chat-session-item .session-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-session-item .session-preview { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-session-item.active .session-preview { color: rgba(255,255,255,0.7); }
.chat-session-item .session-actions { display: none; float: right; }
.chat-session-item:hover .session-actions { display: inline; }
.chat-session-item .session-actions button { background: none; border: none; cursor: pointer; color: inherit; font-size: 0.8rem; padding: 0 0.2rem; }
#chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chat-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.chat-message { max-width: 70%; padding: 0.6rem 0.9rem; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
.chat-message.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-bubble-text); border-bottom-right-radius: 4px; }
.chat-message.assistant { align-self: flex-start; background: var(--assistant-bubble); color: var(--assistant-bubble-text); border-bottom-left-radius: 4px; }
.chat-message.system { align-self: center; background: var(--bg); color: var(--muted); font-size: 0.8rem; font-style: italic; border-radius: 8px; padding: 0.4rem 0.8rem; }
.chat-message .msg-time { font-size: 0.7rem; opacity: 0.6; margin-top: 0.3rem; }
#chat-input-bar { padding: 0.75rem; border-top: 1px solid var(--border); background: var(--card-bg); display: flex; gap: 0.5rem; align-items: center; }
#chat-input-bar select { padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); }
#chat-input-bar textarea { flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); font-family: inherit; resize: none; min-height: 36px; max-height: 120px; }
#chat-input-bar button { padding: 0.5rem 1rem; background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
#chat-input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
#chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.9rem; }
.chat-streaming { font-style: italic; color: var(--muted); }

/* Run detail modal */
#run-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
#run-modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
#run-modal h2 { margin-bottom: 0.5rem; font-size: 1.1rem; }
#run-modal .run-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
#run-modal .run-section { margin-bottom: 0.75rem; }
#run-modal .run-section h4 { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
#run-modal .run-section .output-box { max-height: 200px; }
#run-modal .close-btn { float: right; background: none; border: none; color: var(--fg); font-size: 1.2rem; cursor: pointer; }

/* Memory page */
#page-memory { max-width: 800px; }
.memory-search { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.memory-search input { flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); }
.memory-form { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
.memory-form textarea { width: 100%; min-height: 80px; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); font-family: inherit; margin-bottom: 0.5rem; }
.memory-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; margin-bottom: 0.5rem; }
.memory-item .memory-content { font-size: 0.9rem; margin-bottom: 0.3rem; white-space: pre-wrap; }
.memory-item .memory-meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 0.5rem; align-items: center; }
.memory-item .memory-actions { margin-left: auto; }

@media (max-width: 600px) {
  .cards { grid-template-columns: 1fr; }
  #bottom-bar { flex-wrap: wrap; }
  #bottom-bar input { min-width: 100%; order: 3; }
  #page-chat { flex-direction: column; height: auto; }
  #chat-sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
  .chat-message { max-width: 90%; }
}
</style>
</head>
<body>

<!-- Auth prompt -->
<div id="auth-prompt" class="hidden">
  <form id="auth-form">
    <h2>Agent Hub</h2>
    <p style="margin:0.5rem 0;color:var(--muted)">Enter API key to continue</p>
    <input type="password" id="api-key-input" placeholder="API key" required>
    <button type="submit">Connect</button>
  </form>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <header>
    <h1>Agent Hub</h1>
    <nav>
      <button id="nav-dashboard" class="active" onclick="showPage('dashboard')">Dashboard</button>
      <button id="nav-chat" onclick="showPage('chat')">Chat</button>
      <button id="nav-skills" onclick="showPage('skills')">Skills</button>
      <button id="nav-memory" onclick="showPage('memory')">Memory</button>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <main>
    <!-- Dashboard -->
    <div id="page-dashboard">
      <div id="agent-cards"></div>
    </div>

    <!-- Agent detail panel -->
    <div id="agent-panel" class="hidden"></div>

    <!-- Skills page -->
    <div id="page-skills" class="hidden">
      <div id="skill-form">
        <h3 id="skill-form-title">New Skill</h3>
        <input type="text" id="skill-name" placeholder="Skill name" style="width:200px;margin-bottom:0.5rem">
        <textarea id="skill-content" placeholder="SKILL.md content (YAML frontmatter + markdown)"></textarea>
        <div style="margin-top:0.5rem">
          <button class="btn btn-save" onclick="saveSkill()">Save</button>
          <button class="btn" onclick="clearSkillForm()" style="margin-left:0.5rem">Clear</button>
        </div>
      </div>
      <div id="skills-list" class="skills-list"></div>
      <h3 style="margin:1rem 0 0.5rem">Enable/Disable Matrix</h3>
      <div id="skills-matrix"></div>
    </div>

    <!-- Chat page -->
    <div id="page-chat" class="hidden">
      <div id="chat-sidebar">
        <div id="chat-sidebar-header">
          <h3>Sessions</h3>
          <button class="btn btn-small btn-save" onclick="createChatSession()">+ New</button>
        </div>
        <div id="chat-session-list"></div>
      </div>
      <div id="chat-main">
        <div id="chat-empty">Select or create a session to start chatting.</div>
        <div id="chat-messages" class="hidden"></div>
        <div id="chat-input-bar" class="hidden">
          <select id="chat-agent-select"></select>
          <textarea id="chat-input" placeholder="Type a message..." rows="1" onkeydown="handleChatInputKey(event)"></textarea>
          <button id="chat-send-btn" onclick="sendChatMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- Memory page -->
    <div id="page-memory" class="hidden">
      <h2 style="margin-bottom:1rem">Memory</h2>
      <div class="memory-search">
        <input type="text" id="memory-search-input" placeholder="Search memories..." oninput="searchMemories()">
      </div>
      <div class="memory-form">
        <textarea id="memory-content-input" placeholder="New memory content..."></textarea>
        <div style="display:flex;gap:0.5rem;align-items:center">
          <input type="text" id="memory-tags-input" placeholder="Tags (comma separated)" style="flex:1;padding:0.5rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg)">
          <button class="btn btn-save" onclick="createMemory()">Save Memory</button>
        </div>
      </div>
      <div id="memory-list"></div>
    </div>
  </main>

  <!-- Run detail modal -->
  <div id="run-modal-overlay" class="hidden" onclick="if(event.target===this)closeRunModal()">
    <div id="run-modal"></div>
  </div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <select id="bar-agent"></select>
    <input type="text" id="bar-task" placeholder="Enter task..." onkeydown="if(event.key==='Enter')sendTask()">
    <button onclick="sendTask()">Send</button>
  </div>
</div>

<script>
let API_KEY = localStorage.getItem('hub_api_key') || '';
let agents = [];
let skills = [];
let pollInterval = null;
let currentAgent = null;
let editingSkill = null;

// Chat state
let chatSessions = [];
let currentSessionId = null;
let chatSSE = null;
let chatStreaming = false;

// Memory state
let memories = [];

const API = '/api';

function api(path, opts = {}) {
  const headers = { 'Authorization': 'Bearer ' + API_KEY };
  if (opts.body && typeof opts.body === 'object') {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(API + path, { ...opts, headers }).then(r => {
    if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
    return r.json();
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function logout() {
  localStorage.removeItem('hub_api_key');
  API_KEY = '';
  location.reload();
}

// Auth
if (API_KEY) {
  showApp();
} else {
  document.getElementById('auth-prompt').classList.remove('hidden');
  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    API_KEY = document.getElementById('api-key-input').value;
    localStorage.setItem('hub_api_key', API_KEY);
    try {
      await api('/status');
      showApp();
    } catch {
      alert('Invalid API key');
      API_KEY = '';
      localStorage.removeItem('hub_api_key');
    }
  };
}

function showApp() {
  document.getElementById('auth-prompt').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  startPolling();
}

function showPage(page) {
  document.getElementById('page-dashboard').classList.toggle('hidden', page !== 'dashboard');
  document.getElementById('page-skills').classList.toggle('hidden', page !== 'skills');
  document.getElementById('page-chat').classList.toggle('hidden', page !== 'chat');
  document.getElementById('page-memory').classList.toggle('hidden', page !== 'memory');
  document.getElementById('agent-panel').classList.add('hidden');
  currentAgent = null;
  document.getElementById('nav-dashboard').classList.toggle('active', page === 'dashboard');
  document.getElementById('nav-chat').classList.toggle('active', page === 'chat');
  document.getElementById('nav-skills').classList.toggle('active', page === 'skills');
  document.getElementById('nav-memory').classList.toggle('active', page === 'memory');
  if (page === 'skills') loadSkills();
  if (page === 'chat') loadChatSessions();
  if (page === 'memory') loadMemories();
}

// Polling
function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollStatus();
  pollInterval = setInterval(pollStatus, 2000);
}

async function pollStatus() {
  try {
    const data = await api('/status');
    agents = data.agents || [];
    renderCards();
    renderBar();
    if (currentAgent) pollAgentDetail();
  } catch(e) {
    console.error('Poll error:', e);
  }
}

// Dashboard cards
function renderCards() {
  const groups = { working: [], idle: [], failed: [] };
  agents.forEach(a => {
    const g = a.status === 'working' ? 'working' : a.status === 'failed' ? 'failed' : 'idle';
    groups[g].push(a);
  });
  let html = '';
  const labels = { working: 'Working', idle: 'Idle', failed: 'Failed' };
  for (const [key, label] of Object.entries(labels)) {
    if (groups[key].length === 0) continue;
    html += `<div class="state-group"><h2>${label} (${groups[key].length})</h2><div class="cards">`;
    groups[key].forEach(a => {
      const cls = a.status === 'working' ? 'working' : a.status === 'failed' ? 'failed' : '';
      html += `<div class="card ${cls}" onclick="showAgent('${esc(a.name)}')">
        <h3>${esc(a.name)}</h3>
        <div class="meta">${esc(a.last_run ? a.last_run.agent : '')} · ${a.queue_length || 0} in queue</div>
        ${a.current_task ? `<div class="task">${esc(a.current_task)}</div>` : ''}
      </div>`;
    });
    html += '</div></div>';
  }
  document.getElementById('agent-cards').innerHTML = html || '<p style="color:var(--muted)">No agents configured.</p>';
}

function renderBar() {
  const sel = document.getElementById('bar-agent');
  const current = sel.value;
  sel.innerHTML = agents.map(a => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('');
  if (current && agents.find(a => a.name === current)) sel.value = current;
}

// Agent detail
async function showAgent(name) {
  currentAgent = name;
  document.getElementById('agent-panel').classList.remove('hidden');
  document.getElementById('page-dashboard').classList.add('hidden');
  await pollAgentDetail();
}

async function pollAgentDetail() {
  if (!currentAgent) return;
  try {
    const agent = await api('/agents/' + currentAgent);
    const runs = await api('/runs?agent=' + currentAgent);
    const allSkills = await api('/skills');
    renderAgentPanel(agent, runs.runs || [], allSkills.skills || []);
  } catch(e) { console.error(e); }
}

function renderAgentPanel(agent, runs, allSkills) {
  const latest = runs[0];
  const agentSkills = (agent.skills || []);
  let html = `<h2>${esc(agent.name)} <span style="font-weight:normal;color:var(--muted)">(${esc(agent.title || '')})</span></h2>`;

  // Output
  if (latest && latest.raw_output) {
    html += `<div class="panel-section"><h3>Latest Output</h3><div class="output-box">${esc(latest.raw_output)}</div></div>`;
  }

  // Stop button
  if (latest && latest.state === 'working') {
    html += `<button class="btn btn-danger" onclick="stopRun('${esc(latest.id)}')">Stop</button> `;
  }

  // Edit form
  html += `<div class="panel-section"><h3>Edit Agent</h3>
    <input type="text" id="edit-title" value="${esc(agent.title || '')}" placeholder="Title" style="margin-bottom:0.3rem">
    <input type="text" id="edit-desc" value="${esc(agent.description || '')}" placeholder="Description" style="margin-bottom:0.3rem">
    <div style="display:flex;gap:0.3rem;margin-bottom:0.3rem">
      <input type="text" id="edit-project" value="${esc(agent.project_dir || '')}" placeholder="Project dir" style="flex:1">
      <button class="btn btn-small" onclick="browseProjects()">Browse</button>
    </div>
    <div id="project-browse-list" class="hidden" style="max-height:150px;overflow-y:auto;margin-bottom:0.3rem;padding:0.3rem;border:1px solid var(--border);border-radius:4px;background:var(--bg)"></div>
    <textarea id="edit-guidelines" placeholder="Guidelines">${esc(agent.guidelines || '')}</textarea>
    <button class="btn btn-save" style="margin-top:0.5rem" onclick="saveAgent('${esc(agent.name)}')">Save</button>
  </div>`;

  // Skill toggles
  html += `<div class="panel-section"><h3>Skills</h3><div class="skill-toggles">`;
  allSkills.forEach(s => {
    const checked = agentSkills.includes(s.name) ? 'checked' : '';
    html += `<label class="skill-toggle"><input type="checkbox" ${checked} onchange="toggleSkill('${esc(agent.name)}','${esc(s.name)}',this.checked)">${esc(s.name)}</label>`;
  });
  html += '</div></div>';

  // Run history
  html += `<div class="panel-section"><h3>Run History</h3>`;
  runs.slice(0, 20).forEach(r => {
    html += `<div class="run-item" onclick="showRunDetail('${esc(r.id)}')">
      <span class="state ${esc(r.state)}">${esc(r.state)}</span>
      ${esc(r.task ? r.task.substring(0, 60) : '')}
      ${r.fail_reason ? ' — ' + esc(r.fail_reason) : ''}
    </div>`;
  });
  html += '</div>';

  document.getElementById('agent-panel').innerHTML = html;
}

async function saveAgent(name) {
  const body = {
    title: document.getElementById('edit-title').value,
    description: document.getElementById('edit-desc').value,
    project_dir: document.getElementById('edit-project').value,
    guidelines: document.getElementById('edit-guidelines').value,
  };
  await api('/agents/' + name, { method: 'PUT', body });
  alert('Saved');
}

async function browseProjects() {
  const listEl = document.getElementById('project-browse-list');
  if (!listEl) return;
  listEl.classList.remove('hidden');
  listEl.innerHTML = '<div style="padding:0.5rem;color:var(--muted)">Loading...</div>';
  try {
    const data = await api('/projects');
    const projects = data.projects || [];
    if (!projects.length) {
      listEl.innerHTML = '<div style="padding:0.5rem;color:var(--muted)">No Git repositories found in common directories.</div>';
      return;
    }
    let html = '';
    projects.forEach(p => {
      html += `<div style="padding:0.3rem;cursor:pointer;border-bottom:1px solid var(--border);font-size:0.85rem"
        onclick="selectProject('${esc(p.path)}'">${esc(p.name)}<br><span style="color:var(--muted);font-size:0.8rem">${esc(p.path)}</span></div>`;
    });
    listEl.innerHTML = html;
  } catch(e) {
    listEl.innerHTML = '<div style="padding:0.5rem;color:var(--danger)">Failed to load projects.</div>';
  }
}

function selectProject(path) {
  document.getElementById('edit-project').value = path;
  const listEl = document.getElementById('project-browse-list');
  if (listEl) listEl.classList.add('hidden');
}

async function toggleSkill(agent, skill, enabled) {
  if (enabled) {
    await api('/agents/' + agent + '/skills/' + skill, { method: 'POST' });
  } else {
    await api('/agents/' + agent + '/skills/' + skill, { method: 'DELETE' });
  }
}

async function stopRun(runId) {
  await api('/runs/' + runId + '/stop', { method: 'POST' });
}

async function showRunDetail(runId) {
  const run = await api('/runs/' + runId);
  const modal = document.getElementById('run-modal');
  const stateClass = run.state === 'done' ? 'done' : run.state === 'failed' ? 'failed' : 'working';
  let html = `<button class="close-btn" onclick="closeRunModal()">✕</button>
    <h2>Run Detail</h2>
    <div class="run-meta">
      <span class="state ${esc(stateClass)}">${esc(run.state)}</span>
      · ${esc(run.task ? run.task.substring(0, 80) : '')}
      ${run.created_at ? ' · ' + esc(new Date(run.created_at).toLocaleString()) : ''}
    </div>`;
  if (run.fail_reason) {
    html += `<div class="run-section"><h4>Error</h4><div class="output-box" style="color:var(--danger)">${esc(run.fail_reason)}</div></div>`;
  }
  if (run.answer) {
    html += `<div class="run-section"><h4>Answer</h4><div class="output-box">${esc(run.answer)}</div></div>`;
  }
  if (run.raw_output) {
    html += `<div class="run-section"><h4>Output</h4><div class="output-box">${esc(run.raw_output)}</div></div>`;
  }
  if (run.log_file) {
    html += `<div class="run-section"><h4>Log File</h4><div class="output-box">${esc(run.log_file)}</div></div>`;
  }
  if (run.state === 'done' && run.answer) {
    html += `<div style="margin-top:1rem;display:flex;gap:0.5rem">
      <button class="btn btn-save" onclick="saveRunToMemory('${esc(run.id)}')">Save Answer to Memory</button>
    </div>`;
  }
  modal.innerHTML = html;
  document.getElementById('run-modal-overlay').classList.remove('hidden');
}

async function saveRunToMemory(runId) {
  try {
    const run = await api('/runs/' + runId);
    if (!run.answer) return;
    const tags = prompt('Enter tags for this memory (comma separated, or leave empty):', '');
    await api('/memories', {
      method: 'POST',
      body: {
        content: run.answer,
        tags: tags || '',
        agent_id: run.agent,
      },
    });
    alert('Saved to memory!');
    if (currentSessionId) {
      // Also link to current session if in chat
      const memories = await api('/memories?search=' + encodeURIComponent(run.answer.substring(0, 50)));
      if (memories.length) {
        const saved = memories[0];
        await api('/memories/' + saved.id, {
          method: 'PUT',
          body: { session_id: currentSessionId },
        });
      }
    }
  } catch(e) {
    console.error('Failed to save memory:', e);
    alert('Failed to save to memory');
  }
}

function closeRunModal() {
  document.getElementById('run-modal-overlay').classList.add('hidden');
}

// Send task
async function sendTask() {
  const agent = document.getElementById('bar-agent').value;
  const task = document.getElementById('bar-task').value.trim();
  if (!agent || !task) return;
  await api('/agents/' + agent + '/runs', { method: 'POST', body: { task } });
  document.getElementById('bar-task').value = '';
}

// Skills page
async function loadSkills() {
  try {
    const data = await api('/skills');
    skills = data.skills || [];
    renderSkillsList();
    renderSkillsMatrix();
  } catch(e) { console.error(e); }
}

function renderSkillsList() {
  let html = '';
  skills.forEach(s => {
    html += `<div class="skill-card">
      <h3>${esc(s.name)}</h3>
      <div class="desc">${esc(s.description || '')}</div>
      <div class="agents">Used by: ${esc((s.used_by || []).join(', ') || 'none')}</div>
      <div class="actions">
        <button class="btn btn-small" onclick="editSkill('${esc(s.name)}')">Edit</button>
        <button class="btn btn-small btn-danger" onclick="deleteSkill('${esc(s.name)}')">Delete</button>
      </div>
    </div>`;
  });
  document.getElementById('skills-list').innerHTML = html || '<p style="color:var(--muted)">No skills yet.</p>';
}

function renderSkillsMatrix() {
  if (!skills.length || !agents.length) return;
  let html = '<table class="matrix-table"><tr><th>Skill</th>';
  agents.forEach(a => { html += `<th>${esc(a.name)}</th>`; });
  html += '</tr>';
  skills.forEach(s => {
    html += '<tr><td>' + esc(s.name) + '</td>';
    agents.forEach(a => {
      const checked = (a.skills || []).includes(s.name) ? 'checked' : '';
      html += `<td><input type="checkbox" ${checked} onchange="toggleSkill('${esc(a.name)}','${esc(s.name)}',this.checked)"></td>`;
    });
    html += '</tr>';
  });
  html += '</table>';
  document.getElementById('skills-matrix').innerHTML = html;
}

function editSkill(name) {
  const s = skills.find(sk => sk.name === name);
  if (!s) return;
  editingSkill = name;
  document.getElementById('skill-name').value = name;
  document.getElementById('skill-content').value = s.content || '';
  document.getElementById('skill-form-title').textContent = 'Edit Skill: ' + name;
}

async function saveSkill() {
  const name = document.getElementById('skill-name').value.trim();
  const content = document.getElementById('skill-content').value;
  if (!name) return alert('Name required');
  const method = editingSkill ? 'PUT' : 'POST';
  await api('/skills/' + name, { method, body: { name, content, description: '' } });
  clearSkillForm();
  await loadSkills();
}

function clearSkillForm() {
  editingSkill = null;
  document.getElementById('skill-name').value = '';
  document.getElementById('skill-content').value = '';
  document.getElementById('skill-form-title').textContent = 'New Skill';
}

async function deleteSkill(name) {
  if (!confirm('Delete skill ' + name + '?')) return;
  await api('/skills/' + name, { method: 'DELETE' });
  await loadSkills();
}

// ===================== Chat =====================

async function loadChatSessions() {
  try {
    chatSessions = await api('/sessions');
    renderChatSessions();
    renderChatAgentSelect();
  } catch(e) { console.error('Failed to load sessions:', e); }
}

function renderChatSessions() {
  const list = document.getElementById('chat-session-list');
  if (!chatSessions.length) {
    list.innerHTML = '<div style="padding:1rem;color:var(--muted);font-size:0.85rem">No sessions yet.</div>';
    return;
  }
  let html = '';
  chatSessions.forEach(s => {
    const active = s.id === currentSessionId ? 'active' : '';
    const title = s.title || 'Session';
    const preview = s.last_message_preview || '';
    html += `<div class="chat-session-item ${esc(active)}" onclick="selectChatSession('${esc(s.id)}')">
      <span class="session-actions">
        <button onclick="event.stopPropagation();deleteChatSession('${esc(s.id)}')" title="Delete">✕</button>
      </span>
      <div class="session-title">${esc(title)}</div>
      ${preview ? `<div class="session-preview">${esc(preview)}</div>` : ''}
    </div>`;
  });
  list.innerHTML = html;
}

function renderChatAgentSelect() {
  const sel = document.getElementById('chat-agent-select');
  if (!sel.value && agents.length) sel.value = agents[0].name;
  sel.innerHTML = agents.map(a => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('');
}

async function createChatSession() {
  const agentName = document.getElementById('chat-agent-select').value;
  try {
    const session = await api('/sessions', { method: 'POST', body: { agent_id: agentName, title: 'New Session' } });
    await loadChatSessions();
    selectChatSession(session.id);
  } catch(e) { console.error('Failed to create session:', e); alert('Failed to create session'); }
}

async function selectChatSession(sessionId) {
  // Disconnect any existing SSE
  disconnectSSE();
  currentSessionId = sessionId;
  renderChatSessions();
  document.getElementById('chat-empty').classList.add('hidden');
  document.getElementById('chat-messages').classList.remove('hidden');
  document.getElementById('chat-input-bar').classList.remove('hidden');
  await loadChatMessages(sessionId);
  // Connect SSE for live updates
  connectSSE(sessionId);
}

async function deleteChatSession(sessionId) {
  if (!confirm('Delete this session?')) return;
  try {
    await api('/sessions/' + sessionId, { method: 'DELETE' });
    if (currentSessionId === sessionId) {
      disconnectSSE();
      currentSessionId = null;
      document.getElementById('chat-messages').classList.add('hidden');
      document.getElementById('chat-input-bar').classList.add('hidden');
      document.getElementById('chat-empty').classList.remove('hidden');
      document.getElementById('chat-empty').textContent = 'Select or create a session to start chatting.';
    }
    await loadChatSessions();
  } catch(e) { console.error('Failed to delete session:', e); }
}

async function loadChatMessages(sessionId) {
  try {
    const data = await api('/sessions/' + sessionId);
    const messages = data.messages || [];
    const container = document.getElementById('chat-messages');
    let html = '';
    messages.forEach(m => {
      const role = m.role === 'user' ? 'user' : m.role === 'assistant' ? 'assistant' : 'system';
      const time = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      html += `<div class="chat-message ${esc(role)}">
        ${esc(m.content)}
        ${time ? `<div class="msg-time">${esc(time)}</div>` : ''}
      </div>`;
    });
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
  } catch(e) { console.error('Failed to load messages:', e); }
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !currentSessionId || chatStreaming) return;
  const agentName = document.getElementById('chat-agent-select').value;
  if (!agentName) return alert('Select an agent first');

  // Clear input and disable send
  input.value = '';
  input.style.height = 'auto';
  chatStreaming = true;
  document.getElementById('chat-send-btn').disabled = true;

  // Append user message immediately
  appendChatMessage('user', text);

  try {
    // Disconnect existing SSE before sending
    disconnectSSE();

    // Send message to API
    const result = await api('/sessions/' + currentSessionId + '/messages', {
      method: 'POST',
      body: { content: text, agent_id: agentName }
    });

    // Connect SSE for live output
    connectSSE(currentSessionId, result.run_id);
  } catch(e) {
    console.error('Failed to send message:', e);
    appendChatMessage('system', 'Error: Failed to send message.');
    chatStreaming = false;
    document.getElementById('chat-send-btn').disabled = false;
  }
}

function appendChatMessage(role, content) {
  const container = document.getElementById('chat-messages');
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = `chat-message ${role}`;
  div.innerHTML = `${esc(content)}<div class="msg-time">${esc(time)}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function handleChatInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
}

// Auto-resize textarea
document.addEventListener('DOMContentLoaded', () => {
  const chatInput = document.getElementById('chat-input');
  if (chatInput) {
    chatInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
  }
});

function connectSSE(sessionId, runId) {
  disconnectSSE();
  const url = `${API}/sessions/${sessionId}/stream`;
  chatSSE = new EventSource(url);

  chatSSE.onopen = () => {
    console.log('SSE connected');
  };

  chatSSE.addEventListener('message', (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.event === 'start') {
        appendChatMessage('system', 'Agent is working...');
      } else if (data.event === 'output') {
        // Show streaming output as system messages (throttled)
        if (data.output && data.output.length > 10) {
          // Only show last line of output
          const lines = data.output.split('\n');
          const lastLine = lines[lines.length - 1];
          if (lastLine.trim()) {
            // Update or append streaming indicator
            let streaming = document.getElementById('chat-streaming-msg');
            if (!streaming) {
              appendChatMessage('system', '⋯');
              streaming = document.getElementById('chat-streaming-msg');
            }
            if (!streaming) {
              const container = document.getElementById('chat-messages');
              streaming = container.lastElementChild;
              streaming.id = 'chat-streaming-msg';
            }
            streaming.classList.add('chat-streaming');
            streaming.textContent = lastLine.trim().substring(0, 200);
            const container = document.getElementById('chat-messages');
            container.scrollTop = container.scrollHeight;
          }
        }
      } else if (data.event === 'complete') {
        // Remove streaming indicator
        const streaming = document.getElementById('chat-streaming-msg');
        if (streaming) streaming.remove();
        if (data.answer) {
          appendChatMessage('assistant', data.answer);
        }
        chatStreaming = false;
        document.getElementById('chat-send-btn').disabled = false;
        // Reload sessions to update previews
        loadChatSessions();
      } else if (data.event === 'error') {
        const streaming = document.getElementById('chat-streaming-msg');
        if (streaming) streaming.remove();
        appendChatMessage('system', 'Error: ' + (data.message || 'Run failed.'));
        chatStreaming = false;
        document.getElementById('chat-send-btn').disabled = false;
      } else if (data.event === 'end') {
        chatSSE.close();
        chatSSE = null;
      }
    } catch(e) {
      console.error('SSE parse error:', e);
    }
  });

  chatSSE.onerror = () => {
    console.error('SSE error');
    chatSSE.close();
    chatSSE = null;
    chatStreaming = false;
    document.getElementById('chat-send-btn').disabled = false;
    // Remove streaming indicator on error
    const streaming = document.getElementById('chat-streaming-msg');
    if (streaming) streaming.remove();
  };
}

function disconnectSSE() {
  if (chatSSE) {
    chatSSE.close();
    chatSSE = null;
  }
  // Remove streaming indicator
  const streaming = document.getElementById('chat-streaming-msg');
  if (streaming) streaming.remove();
}

// ===================== Memory =====================

async function loadMemories() {
  try {
    const data = await api('/memories');
    memories = data.memories || [];
    renderMemories(memories);
  } catch(e) { console.error('Failed to load memories:', e); }
}

function renderMemories(list) {
  const container = document.getElementById('memory-list');
  if (!list.length) {
    container.innerHTML = '<p style="color:var(--muted)">No memories yet.</p>';
    return;
  }
  let html = '';
  list.forEach(m => {
    const date = m.created_at ? new Date(m.created_at).toLocaleDateString() : '';
    const tags = m.tags ? m.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
    html += `<div class="memory-item">
      <div class="memory-content">${esc(m.content)}</div>
      <div class="memory-meta">
        ${date ? esc(date) : ''}
        ${tags.length ? esc(tags.map(t => '#' + t).join(' ')) : ''}
        <span class="memory-actions">
          <button class="btn btn-small btn-danger" onclick="deleteMemory('${esc(m.id)}')">Delete</button>
        </span>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

async function searchMemories() {
  const query = document.getElementById('memory-search-input').value.trim();
  try {
    const url = query ? `/memories?search=${encodeURIComponent(query)}` : '/memories';
    const data = await api(url);
    memories = data.memories || [];
    renderMemories(memories);
  } catch(e) { console.error('Search failed:', e); }
}

async function createMemory() {
  const content = document.getElementById('memory-content-input').value.trim();
  if (!content) return alert('Memory content required');
  const tags = document.getElementById('memory-tags-input').value.trim();
  try {
    await api('/memories', { method: 'POST', body: { content, tags } });
    document.getElementById('memory-content-input').value = '';
    document.getElementById('memory-tags-input').value = '';
    await loadMemories();
  } catch(e) { console.error('Failed to create memory:', e); alert('Failed to create memory'); }
}

async function deleteMemory(memoryId) {
  if (!confirm('Delete this memory?')) return;
  try {
    await api('/memories/' + memoryId, { method: 'DELETE' });
    await loadMemories();
  } catch(e) { console.error('Failed to delete memory:', e); }
}
