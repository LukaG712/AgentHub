# --- Grok Bot Features ---

# Auto Review: pattern-based detection of sensitive actions
# When enabled, matching patterns pause the run and request approval.
auto_review:
  enabled: false
  patterns:
    - "git\\s+push\\b"
    - "rm\\s+-rf\\b"
    - "curl\\s+https?://"
    - "wget\\s+https?://"
    - "pip\\s+install\\b"
    - "chmod\\s+[0-7]*777\\b"

# Max handoff hops: prevents infinite loops when Bots hand off to each other
max_handoff_hops: 5

