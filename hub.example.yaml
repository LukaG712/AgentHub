# --- Grok Bot Features ---

# Auto Review: pattern-based detection of sensitive actions
# When enabled, matching patterns pause the run and request approval.
auto_review:
  enabled: false
  patterns:
    - "git\\s+push\\b"
    - "rm\\s+-rf\\b"
    - "curl\\s+https?://"
    - "wget\\s+https?://"
    - "pip\\s+install\\b"
    - "chmod\\s+[0-7]*777\\b"

# Max handoff hops: prevents infinite loops when Bots hand off to each other
max_handoff_hops: 5

# Plugins: MCP servers or local scripts, toggled per-Bot
# plugins:
#   - name: "my-mcp-server"
#     type: "mcp"
#     command: ["python", "-m", "mcp_server"]
#   - name: "local-tool"
#     type: "script"
#     command: ["python", "scripts/my_tool.py"]

# Data directory: where runs, locks, and Bot memory files are stored
# data_dir: "data"

# --- Network & CORS configuration ---
# CORS controls which browsers can access the API from different origins.
# For LAN access, add your VM's IP or hostname to the origins list.
# cors:
#   enabled: true
#   origins:
#     - "http://localhost:*"
#     - "http://127.0.0.1:*"
#     - "http://192.168.1.100:*"    # Your VM's LAN IP
#     - "http://agent-hub.local:*"  # Optional: local DNS hostname

# --- Server binding ---
# The server binds to 127.0.0.1 by default (localhost only).
# For LAN access, use:  agent-hub serve --host 0.0.0.0
# For production mode (no auto-reload):  agent-hub serve --host 0.0.0.0 --port 8080
# The start.sh and start.ps1 scripts support --production and --host flags.
